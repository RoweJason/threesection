<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面切换效果</title>
  <link rel="stylesheet" href="../styles/hide_sec/hide_sec3.css">
</head>
<body>
  <!-- 第一页：图片 -->
  <div class="page" id="page1">
    <img src="../assets/images/hide_sec3/first.png" alt="第一页图片" id="page1-img">
    <!-- 添加第一个文本层 -->
    <div class="text-layer" id="text1">
      这里的彩虹，已是往昔了
    </div>
    <!-- 添加第二个文本层 -->
    <div class="text-layer" id="text2">
      我故乡那道彩虹，是否亦成为了往昔
    </div>
  </div>
  <!-- 第二页：图片 -->
  <div class="page" id="page2">
    <img src="../assets/images/hide_sec3/second.png" alt="第二页图片" id="page2-img">
  </div>
  <!-- 第三页：多行滚动图片 -->
  <div class="page" id="page3">
    <!-- 背景图 -->
    <img src="../assets/images/hide_sec3/third.png" alt="第三页背景" class="bg-image">
    
    <!-- 第一排：向右滚动 -->
    <div class="scroll-row right" style="top: 7.5vh;">
      <img src="../assets/images/hide_sec3/third/1.png" alt="第三页第一排图1" class="scroll-img">
      <img src="../assets/images/hide_sec3/third/2.png" alt="第三页第一排图2" class="scroll-img">
      <img src="../assets/images/hide_sec3/third/3.png" alt="第三页第一排图3" class="scroll-img">
      <img src="../assets/images/hide_sec3/third/4.png" alt="第三页第一排图4" class="scroll-img">
    </div>
    
    <!-- 第二排：向左滚动 -->
    <div class="scroll-row left" style="top: 36.8vh;">
      <img src="../assets/images/hide_sec3/third/5.png" alt="第三页第二排图1" class="scroll-img">
      <img src="../assets/images/hide_sec3/third/6.png" alt="第三页第二排图2" class="scroll-img">
      <img src="../assets/images/hide_sec3/third/7.png" alt="第三页第二排图3" class="scroll-img">
      <img src="../assets/images/hide_sec3/third/8.png" alt="第三页第二排图4" class="scroll-img">
    </div>
    
    <!-- 第三排：向右滚动 -->
    <div class="scroll-row right" style="top: 66.2vh;">
      <img src="../assets/images/hide_sec3/third/9.png" alt="第三页第三排图1" class="scroll-img">
      <img src="../assets/images/hide_sec3/third/10.png" alt="第三页第三排图2" class="scroll-img">
      <img src="../assets/images/hide_sec3/third/11.png" alt="第三页第三排图3" class="scroll-img">
      <img src="../assets/images/hide_sec3/third/12.png" alt="第三页第三排图4" class="scroll-img">
    </div>
  </div>
  
  <!-- 第四页：多行滚动图片 -->
  <div class="page" id="page4">
    <!-- 背景图 -->
    <img src="../assets/images/hide_sec3/fourth.png" alt="第四页背景" class="bg-image">
    
    <!-- 第一排：向右滚动 -->
    <div class="scroll-row right" style="top: 7.5vh;">
      <img src="../assets/images/hide_sec3/fourth-row1-1.png" alt="第四页第一排图1" class="scroll-img">
      <img src="../assets/images/hide_sec3/fourth-row1-2.png" alt="第四页第一排图2" class="scroll-img">
      <img src="../assets/images/hide_sec3/fourth-row1-3.png" alt="第四页第一排图3" class="scroll-img">
      <img src="../assets/images/hide_sec3/fourth-row1-4.png" alt="第四页第一排图4" class="scroll-img">
    </div>
    
    <!-- 第二排：向左滚动 -->
    <div class="scroll-row left" style="top: 36.8vh;">
      <img src="../assets/images/hide_sec3/fourth-row2-1.png" alt="第四页第二排图1" class="scroll-img">
      <img src="../assets/images/hide_sec3/fourth-row2-2.png" alt="第四页第二排图2" class="scroll-img">
      <img src="../assets/images/hide_sec3/fourth-row2-3.png" alt="第四页第二排图3" class="scroll-img">
      <img src="../assets/images/hide_sec3/fourth-row2-4.png" alt="第四页第二排图4" class="scroll-img">
    </div>
    
    <!-- 第三排：向右滚动 -->
    <div class="scroll-row right" style="top: 66.2vh;">
      <img src="../assets/images/hide_sec3/fourth-row3-1.png" alt="第四页第三排图1" class="scroll-img">
      <img src="../assets/images/hide_sec3/fourth-row3-2.png" alt="第四页第三排图2" class="scroll-img">
      <img src="../assets/images/hide_sec3/fourth-row3-3.png" alt="第四页第三排图3" class="scroll-img">
      <img src="../assets/images/hide_sec3/fourth-row3-4.png" alt="第四页第三排图4" class="scroll-img">
    </div>
  </div>

  <script src="../scripts/sec1/jianbian.js"></script>
</body>
</html>
