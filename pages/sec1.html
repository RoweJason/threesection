<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面切换效果</title>
  <link rel="stylesheet" href="../styles/sec1/sec1.css">
</head>
<body>
  <!-- 第一页：图片 -->
  <div class="page" id="page1">
    <img src="../assets/images/sec1/first.png" alt="第一页图片" id="page1-img">
  </div>
  <!-- 第二页：视频 -->
  <div class="page" id="page2">
    <video src="../assets/videos/sec1/p1.mp4" controls id="page2-video"></video>
  </div>
  <!-- 第三页：视频 -->
  <div class="page" id="page3">
    <video src="../assets/videos/sec1/p2.mp4" controls id="page3-video"></video>
  </div>
  <!-- 第四页：视频 -->
  <div class="page" id="page4">
    <video src="../assets/videos/sec1/p3.mp4" controls id="page4-video"></video>
  </div>
  <!-- 第五页：视频 -->
  <div class="page" id="page5">
    <video src="../assets/videos/sec1/p4.mp4" controls id="page5-video"></video>
  </div>
  <!-- 第六页：视频 -->
  <div class="page" id="page6">
    <video src="../assets/videos/sec1/p5.mp4" controls id="page6-video"></video>
  </div>
  <!-- 第七页：视频 -->
  <div class="page" id="page7">
    <video src="../assets/videos/sec1/p6.mp4" controls id="page7-video"></video>
  </div>
  <!-- 第八页：图片 -->
  <div class="page" id="page8">
    <img src="../assets/images/sec1/second.png" alt="第八页图片" id="page8-img">
  </div>

  <script src="../scripts/sec1/jianbian.js"></script>
</body>
</html>
